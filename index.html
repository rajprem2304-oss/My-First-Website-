<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First Website</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f0f7ff;
      padding: 40px 15px;
    }
    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      max-width: 400px;
      margin: auto;
    }
    h1 { color: #1769aa; }
    p { font-size: 18px; line-height: 1.6; }
    button {
      background: #16803c;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>नमस्ते दोस्तों! 👋</h1>
    <p>यह मेरी पहली वेबसाइट है।</p>
    <p>मैं मोबाइल से वेबसाइट बनाना सीख रहा हूँ।</p>
    <button onclick="alert('स्वागत है!')">यहाँ क्लिक करें</button>
  </div>
</body>
</html>
